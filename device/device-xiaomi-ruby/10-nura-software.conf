[Service]
# pmOS creates uid 10000, the upstream unit hardcodes 1000.
User=10000
Group=10000
Environment=HOME=/home/nura
Environment=LANG=C.UTF-8
Environment=XDG_SEAT=seat0
Environment=XDG_RUNTIME_DIR=/run/user/10000
# No panfrost/mali in this kernel: Mesa software rasterizer on dumb buffers.
Environment=LIBGL_ALWAYS_SOFTWARE=1
Environment=MESA_LOADER_DRIVER_OVERRIDE=swrast
Environment=GBM_ALWAYS_SOFTWARE=1
# KWin 6 only accepts O2/O2ES here; any other value makes
# attemptOpenGLCompositing() return false and then qCFatal() (black panel).
Environment=KWIN_COMPOSE=O2
# KWin hangs in its first *atomic* commit on this vendor DRM driver
# ("The main thread was hanging temporarily!"), while nurafb drives the same
# panel fine with the legacy SETCRTC path.  Use the legacy path here too.
Environment=KWIN_DRM_NO_AMS=1
# Never hand a client buffer straight to the primary plane: with llvmpipe the
# buffers are dumb buffers and direct scanout has no format match.
Environment=KWIN_DRM_NO_DIRECT_SCANOUT=1
# With a software compositor KWin can only present through the CPU-copy path,
# which accepts ARGB8888/XRGB8888 only ("Cannot import a buffer with
# unsupported format").  Pin 8-bit colour and linear (unmodified) buffers.
Environment=KWIN_DRM_PREFER_COLOR_DEPTH=8
Environment=KWIN_DRM_USE_MODIFIERS=0
# The software EGL device (/dev/udmabuf) is not addressable by MTK's display
# IOMMU on this panel: the journal shows reads at 0xf9000000 -> pa=0 and a
# black scanout, while KWin's ScreenShot2 still contains the Plasma frame.
# Force KWin's dumb-buffer CPU-copy path instead of udmabuf import.
Environment=KWIN_DISABLE_UDMABUF_IMPORT=1
Environment=QT_QUICK_BACKEND=software
# Frame-level evidence: if KWin never presents, the report has no CSV rows.
Environment=KWIN_LOG_PERFORMANCE_DATA=1
# The compositor owns the panel; the text painter must not start.
