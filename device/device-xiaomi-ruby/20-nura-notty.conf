[Unit]
# This kernel has no CONFIG_VT/fbcon: /dev/tty0 does not exist, so the stock
# unit silently skips itself on ConditionPathExists=/dev/tty0 and would then
# fail on TTYPath=/dev/tty1 and StandardInput=tty-fail.  Clear every VT-only
# setting and gate on the DRM node instead.
ConditionPathExists=
ConditionPathExists=/dev/dri/card0
After=
Before=graphical.target
Conflicts=getty@tty1.service nura-console.service
# v18 died in startplasmacompositor ("Could not start D-Bus") because no user
# manager ran.  With dbus-run-session the private bus cannot activate
# org.freedesktop.systemd1 either (journal: "Activated service ... failed"), so
# kded/plasmashell/user services misbehave.  Use the real systemd user bus.
Wants=user@10000.service
After=user@10000.service

[Service]
# ExecStartPost runs diagnostics for at least 30 seconds. The upstream 30s
# timeout kills the entire session before that helper finishes.
TimeoutStartSec=120
TTYPath=
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
StandardInput=null
UtmpIdentifier=
UtmpMode=user
# No VT => no PAM login session; pam_systemd would register a seatless session.
PAMName=
User=10000
Group=10000
Environment=XDG_RUNTIME_DIR=/run/user/10000
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/10000/bus
# The initramfs nurafb survives switch_root and keeps DRM master: KWin gets
# "Failed to authenticate the drm magic token ... Permission denied" until it
# is killed.  nura-gpu-prep detaches panfrost first (Mesa has no Mali-G68).
ExecStartPre=+/usr/bin/nura-gpu-prep
ExecStartPre=+/usr/bin/nura-takeover
# Stale wayland sockets from the previous session make KWin pick wayland-1,
# and helpers that default to wayland-0 then fail to connect.
ExecStartPre=+/bin/sh -c 'rm -f /run/user/10000/wayland-* /run/user/10000/*.lock'
ExecStartPre=+/bin/mkdir -p /run/user/10000
ExecStartPre=+/bin/chown 10000:10000 /run/user/10000
ExecStartPre=+/bin/chmod 0700 /run/user/10000
ExecStartPre=+/usr/bin/systemctl start user@10000.service
# Bounded wait for the user bus (dbus.socket => /run/user/10000/bus); never
# fail the unit here, the diagnostic is what matters.  $$ escapes the dollar:
# systemd itself expands $VAR in Exec lines.
ExecStartPre=+/bin/sh -c 'n=0; while [ ! -S /run/user/10000/bus ] && [ $$n -lt 150 ]; do sleep 0.1; n=$$((n+1)); done; echo "nura: session bus after $$n ticks" > /dev/kmsg; [ -S /run/user/10000/bus ] || echo "nura: session bus MISSING" > /dev/kmsg'
ExecStartPost=+/usr/bin/nura-backlight
SupplementaryGroups=input video render audio
