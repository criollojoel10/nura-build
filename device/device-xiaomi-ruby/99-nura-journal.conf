[Journal]
# El rootfs vive en una particion de 112 GiB: no hay razon para rotar a 24 MB.
# Con 24 MB el spam termico de MTK (cada segundo) borraba el arranque entero
# antes de poder leerlo, incluidos los mensajes de systemd y de nura-shot.
Storage=persistent
SystemMaxUse=512M
SystemMaxFileSize=64M
RuntimeMaxUse=64M
RuntimeMaxFileSize=16M
# MaxLevelKMsg=info mantiene el panel informado sin inundar /dev/kmsg.
ForwardToKMsg=yes
MaxLevelKMsg=info
