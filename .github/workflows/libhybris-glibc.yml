name: libhybris glibc experimental

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build in Debian aarch64
        run: |
          set -Eeuo pipefail
          mkdir -p out
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            debian:trixie-slim /bin/sh /src/tools/build-libhybris-glibc-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libhybris-glibc-aarch64-experimental
          path: out/
          if-no-files-found: error
          retention-days: 7
